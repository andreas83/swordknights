; Swordknights export presets.
;
; Hand-maintained and deliberately minimal: only options that differ from the
; engine default are listed. Godot fills in every option it does not find here
; with that option's default, so a short file is a valid file -- and a readable
; diff when something does change. Every key below was verified against
; EditorExportPlatform*.create_preset() on Godot 4.5.1.
;
; THIS FILE MUST STAY FREE OF CREDENTIALS.
;
;   Android -- keystore path / alias / password are left empty here. Godot 4.5
;   reads them straight from the environment at export time:
;       GODOT_ANDROID_KEYSTORE_RELEASE_PATH
;       GODOT_ANDROID_KEYSTORE_RELEASE_USER
;       GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD
;
;   iOS -- team id, signing identity and provisioning profile are left empty
;   here. Godot has no environment-variable equivalent, so CI appends a
;   throwaway overlay to this file inside the runner only, built from
;   repository secrets, and never commits or uploads it.
;
; See docs/ci.md for the exact secret names.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, addons/gut/*, .gutconfig.json"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

; Single-threaded WebAssembly. This is the whole COOP/COEP decision: with
; thread_support off Godot links the *_nothreads template, which never touches
; SharedArrayBuffer, so the build needs no Cross-Origin-Opener-Policy or
; Cross-Origin-Embedder-Policy headers and runs on GitHub Pages unmodified.
; See docs/ci.md for what this costs.
variant/thread_support=false
variant/extensions_support=false

; The game ships no VRAM-compressed textures (pixel art, nearest filtering),
; so neither compression pass has anything to do. Both off keeps the export
; from demanding a reimport.
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false

html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
; Mobile browsers are a first-class target for the playtest link.
html/experimental_virtual_keyboard=true

; No service worker: a PWA would cache the build and hand playtesters a stale
; game after every push. The cross-origin-isolation shim it carries is only
; needed for the threaded template, which we do not use.
progressive_web_app/enabled=false
progressive_web_app/background_color=Color(0.16862746, 0.039215688, 0.078431375, 1)

[preset.1]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, addons/gut/*, .gutconfig.json"
export_path="build/android/swordknights.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

; Prebuilt APK template rather than a Gradle build: no Android Gradle plugin,
; no NDK, and the CI runner only needs the SDK platform-tools and build-tools
; that Godot shells out to for zipalign and apksigner.
gradle_build/use_gradle_build=false
gradle_build/export_format=0

; 32-bit ARM is still a meaningful share of cheap Android hardware, which is
; squarely this game's audience.
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false

version/code=1
version/name="0.1.0"
package/unique_name="com.swordknights.game"
package/name="Swordknights"
package/signed=true
package/app_category=2
screen/immersive_mode=true
screen/background_color=Color(0.16862746, 0.039215688, 0.078431375, 1)
user_data_backup/allow=false
; The online duel connects two phones directly or through a relay. Without
; these the sockets are refused by Android and the duel cannot even host.
permissions/internet=true
permissions/access_network_state=true

; Left empty on purpose -- supplied via GODOT_ANDROID_KEYSTORE_RELEASE_* .
keystore/release=""
keystore/release_user=""
keystore/release_password=""

[preset.2]

name="iOS"
platform="iOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, addons/gut/*, .gutconfig.json"
export_path="build/ios/swordknights.ipa"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

architectures/arm64=true
application/bundle_identifier="com.swordknights.game"
application/short_version="0.1.0"
application/version="1"
; 2 == iPhone only. The game is landscape-locked and designed for a phone.
application/targeted_device_family=2
application/min_ios_version="14.0"
; 0 == app-store, 1 == development. Release builds go to the store channel.
application/export_method_release=0
application/export_method_debug=1
; With no macOS runner and no signing material, CI can still produce the Xcode
; project. Flipped to false only when real signing secrets are present.
application/export_project_only=true

entitlements/increased_memory_limit=false
entitlements/game_center=false
entitlements/push_notifications="Disabled"
user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false

; Left empty on purpose -- supplied by the CI-generated overlay.
application/app_store_team_id=""
application/code_sign_identity_debug=""
application/code_sign_identity_release=""
application/provisioning_profile_uuid_debug=""
application/provisioning_profile_uuid_release=""
application/provisioning_profile_specifier_debug=""
application/provisioning_profile_specifier_release=""

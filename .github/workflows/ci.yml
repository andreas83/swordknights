name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI never needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must stay in step with the "4.5" entry in project.godot's config/features.
  GODOT_VERSION: '4.5.1'

jobs:
  lint:
    name: Static analysis (gdtoolkit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      # The version is pinned in the requirements file so there is one place to
      # bump it, and so setup-python has something to key its cache on.
      - name: Install gdtoolkit
        run: pip install -r .github/requirements-ci.txt

      # gdlint resolves .gdlintrc from the working directory upwards, so this
      # must run from the repository root. legacy/ and addons/ are excluded
      # there, not here.
      - name: gdlint
        run: gdlint .

      # Blocking for the code this pipeline owns. Everything under tests/ is
      # kept gdformat-clean, so there is no excuse for it to drift.
      - name: gdformat --check (tests)
        run: gdformat --check tests

      # Advisory for the rest, deliberately. gdformat currently rewrites
      # tools/configure_project.gd in ways that lose information: it strips the
      # blank lines that group the settings dictionary into labelled sections
      # and wraps the print() in nested parentheses. Adopting it repo-wide is a
      # project decision and wants its own commit (see docs/ci.md); forcing it
      # here would also collide with gameplay work in flight. Reported, not
      # enforced.
      - name: gdformat --check (scripts, tools) -- advisory
        continue-on-error: true
        run: gdformat --check scripts tools

  check:
    name: Import, parse-check, boot and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          # Export templates are a 1.3 GB download and nothing here exports.
          templates: 'false'

      # Builds .godot/: the import cache, the UID cache and -- the part the
      # test run depends on -- the global class name registry that makes
      # GutTest resolvable.
      - name: Import project
        run: godot --headless --path . --import

      # `--import` exits 0 even when a script fails to parse (verified on
      # 4.5.1), so the parse check is a separate, explicit pass.
      - name: Parse-check every GDScript file
        run: .github/scripts/check_scripts.sh

      # Catches what parsing cannot: errors raised once the scene tree is live.
      - name: Boot smoke test
        run: .github/scripts/smoke_boot.sh 60

      - name: Run test suite
        run: .github/scripts/run_tests.sh build/test-results/gut.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-test-results
          path: build/test-results/
          if-no-files-found: error

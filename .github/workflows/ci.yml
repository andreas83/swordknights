name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI never needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must stay in step with the "4.5" entry in project.godot's config/features.
  GODOT_VERSION: '4.5.1'

jobs:
  lint:
    name: Static analysis (gdtoolkit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      # The version is pinned in the requirements file so there is one place to
      # bump it, and so setup-python has something to key its cache on.
      - name: Install gdtoolkit
        run: pip install -r .github/requirements-ci.txt

      # gdlint resolves .gdlintrc from the working directory upwards, so this
      # must run from the repository root. legacy/ and addons/ are excluded
      # there, not here.
      - name: gdlint
        run: gdlint .

      # Advisory, deliberately, and not yet a gate anywhere.
      #
      # The repository has never been run through gdformat: it would currently
      # rewrite roughly two thirds of the GDScript in the tree. Some of that is
      # harmless line-joining, but some of it loses information -- in
      # tools/configure_project.gd it strips the blank lines that group the
      # settings dictionary into commented sections and double-parenthesises a
      # print(). Turning that into a required check would mean reformatting
      # files that two other workstreams are editing right now.
      #
      # So: reported on every run, enforced on none. Adopting it is a project
      # decision that wants its own commit, and docs/ci.md has the two steps.
      #
      # Note the explicit paths: gdformat has no equivalent of gdlint's
      # excluded_directories, so a bare `gdformat .` would also rewrite
      # vendored GUT and the legacy prototypes.
      - name: gdformat --check -- advisory
        continue-on-error: true
        run: gdformat --check scripts tools tests

  check:
    name: Import, parse-check, boot and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          # Export templates are a 1.3 GB download and nothing here exports.
          templates: 'false'

      # Builds .godot/: the import cache, the UID cache and -- the part the
      # test run depends on -- the global class name registry that makes
      # GutTest resolvable.
      - name: Import project
        run: godot --headless --path . --import

      # `--import` exits 0 even when a script fails to parse (verified on
      # 4.5.1), so the parse check is a separate, explicit pass.
      - name: Parse-check every GDScript file
        run: .github/scripts/check_scripts.sh

      # Catches what parsing cannot: errors raised once the scene tree is live.
      - name: Boot smoke test
        run: .github/scripts/smoke_boot.sh 60

      - name: Run test suite
        run: .github/scripts/run_tests.sh build/test-results/gut.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-test-results
          path: build/test-results/
          if-no-files-found: error

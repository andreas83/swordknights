name: Android APK (debug)

# The development build for phones, on every push to main and on demand from
# the Actions tab. Two jobs:
#
#   apk      stamp the build number, export a debug APK, verify its signature
#            and its levels, upload it as the run's artifact
#   publish  main only: put that APK on the rolling `dev` pre-release with a
#            version.json, which is what the app's update check reads
#
# The `dev` pre-release is the install channel: its asset URL never changes,
#   https://github.com/<owner>/<repo>/releases/download/dev/swordknights-dev.apk
# and it downloads without a GitHub login, which an Actions artifact never
# does (artifacts need a token even on a public repository, arrive zipped and
# expire). A build installed from there sees the next one appear and offers it
# on its title screen. The artifact is still uploaded, for anyone who wants the
# APK of one particular run.
#
# This workflow is the only one that builds the debug APK; the public site
# links to the `dev` asset rather than building its own (see pages.yml).
#
# Signing: a debug key kept in the repository secret DEBUG_KEYSTORE_B64 when
# there is one, otherwise the same key from the Actions cache, generated by
# the first run that finds neither. It must stay the same from build to build,
# or Android refuses each update as "signed differently". docs/ci.md, "The
# debug key", says how to move the cached key into the secret.

on:
  workflow_dispatch:
    inputs:
      export_keystore:
        description: >-
          Also upload the cached debug keystore, encrypted with the
          KEYSTORE_EXPORT_PASSPHRASE secret (see docs/ci.md, "The debug key")
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'legacy/**'

permissions:
  contents: read

# On main, never cancel: a run cancelled halfway through `publish` would leave
# the dev release without its APK. GitHub keeps at most one run waiting per
# group and drops older waiting ones, so a burst of pushes builds the first and
# the last, not every one. Elsewhere (a manual run on a branch), the newest run
# wins as before.
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GODOT_VERSION: '4.5.1'

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      code: ${{ steps.stamp.outputs.code }}
      name: ${{ steps.stamp.outputs.name }}
      signer: ${{ steps.verify.outputs.signer }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Same check as release.yml: the hosted image ships the SDK, and a missing
      # build-tools directory is the usual cause of an export that fails with
      # no explanation.
      - name: Verify the Android SDK is present
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk}" || ! -d "${sdk}" ]]; then
            echo "::error::No Android SDK on this runner (ANDROID_HOME/ANDROID_SDK_ROOT unset)."
            exit 1
          fi
          test -x "${sdk}/platform-tools/adb"
          ls -d "${sdk}"/build-tools/*/apksigner >/dev/null
          echo "ANDROID_HOME=${sdk}" >> "$GITHUB_ENV"
          echo "Android SDK: ${sdk}"

      # Android installs an APK over the one on the phone only if its version
      # code is higher. The run number rises by one on every run of this
      # workflow and is never reused, so it is the code. The same call writes
      # scripts/core/build_stamp.gd, which is how the app knows its own build
      # and where to look for the next one. Never committed.
      - name: Stamp the build number and commit
        id: stamp
        run: |
          .github/scripts/stamp_version.sh --dev "${GITHUB_RUN_NUMBER}" "${GITHUB_SHA}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/dev/version.json"

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: 'true'

      - name: Import project
        run: godot --headless --path . --import

      # Godot keeps the SDK and JDK paths in its editor settings, not in the
      # project, and on a fresh runner it guesses ~/Android/Sdk -- not where the
      # hosted image puts the SDK. Written explicitly, after the import has
      # created the file, rather than trusting the guess or the environment.
      - name: Point Godot at the Android SDK and JDK
        run: |
          set -euo pipefail
          settings="${HOME}/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"
          test -f "${settings}"
          for entry in \
              "export/android/android_sdk_path = \"${ANDROID_HOME}\"" \
              "export/android/java_sdk_path = \"${JAVA_HOME}\""; do
            key="${entry%% =*}"
            if grep -q "^${key} = " "${settings}"; then
              sed -i "s|^${key} = .*|${entry}|" "${settings}"
            else
              echo "${entry}" >> "${settings}"
            fi
          done
          grep -E '^export/android/(android|java)_sdk_path' "${settings}"

      # One debug identity for every build, so a new APK installs over the last
      # one instead of being refused for a changed signature.
      #
      # The secret comes first because the cache is not a safe home for it:
      # GitHub evicts a cache entry nobody has read for seven days, and an
      # evicted key means a new key, and a new key means uninstalling the game
      # before the next build will install. A secret does not expire, and pull
      # requests from forks cannot read it, which a cache entry they can.
      - name: Use the debug keystore from the repository secret, if set
        id: keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          keystore="${HOME}/.android/swordknights-debug.keystore"
          mkdir -p "${HOME}/.android"
          if [[ -n "${DEBUG_KEYSTORE_B64}" ]]; then
            printf '%s' "${DEBUG_KEYSTORE_B64}" | base64 -d > "${keystore}"
            chmod 600 "${keystore}"
            test -s "${keystore}"
            echo "Signing with the keystore from DEBUG_KEYSTORE_B64."
            echo "source=secret" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No DEBUG_KEYSTORE_B64 secret; using the cached debug key. GitHub evicts it after 7 days unused -- see docs/ci.md, 'The debug key'."
            echo "source=cache" >> "$GITHUB_OUTPUT"
          fi
          echo "DEBUG_KEYSTORE=${keystore}" >> "$GITHUB_ENV"

      # Skipped when the secret is in use, so a key from the secret is never
      # saved into the cache, where every workflow run could read it.
      - name: Restore the debug keystore from the cache
        id: cache
        if: steps.keystore.outputs.source == 'cache'
        uses: actions/cache@v4
        with:
          path: ~/.android/swordknights-debug.keystore
          key: android-debug-keystore-v1

      - name: Generate the debug keystore if there is none yet
        if: steps.keystore.outputs.source == 'cache'
        run: |
          set -euo pipefail
          if [[ -s "${DEBUG_KEYSTORE}" ]]; then
            echo "Reusing the cached debug keystore."
          else
            keytool -genkeypair -noprompt \
              -keystore "${DEBUG_KEYSTORE}" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::Generated a NEW debug key. A phone with an earlier build must uninstall it once before this one will install."
          fi

      # The one way to get the cached key out, so it can become the secret
      # without changing the key. Encrypted, because on a public repository
      # every signed-in GitHub user can download a run's artifacts; the
      # passphrase is a secret the owner sets for this and deletes afterwards.
      - name: Export the cached debug keystore, encrypted
        if: inputs.export_keystore
        env:
          PASSPHRASE: ${{ secrets.KEYSTORE_EXPORT_PASSPHRASE }}
          SOURCE: ${{ steps.keystore.outputs.source }}
        run: |
          set -euo pipefail
          if [[ "${SOURCE}" == "secret" ]]; then
            echo "::notice::DEBUG_KEYSTORE_B64 is already set; there is no cached key to export."
            exit 0
          fi
          if [[ -z "${PASSPHRASE}" ]]; then
            echo "::error::Set the KEYSTORE_EXPORT_PASSPHRASE secret first; docs/ci.md, 'The debug key', has the steps."
            exit 1
          fi
          out="${RUNNER_TEMP}/keystore-export"
          install -m 700 -d "${out}"
          # Through a file, first line only -- the same thing the decrypting
          # side's `-pass file:` reads, so a trailing newline in the secret
          # cannot make the two passphrases differ.
          printf '%s\n' "${PASSPHRASE}" | head -n 1 > "${out}/pass"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "${DEBUG_KEYSTORE}" -out "${out}/swordknights-debug.keystore.enc" \
            -pass "file:${out}/pass"
          rm -f "${out}/pass"
          keytool -list -v -keystore "${DEBUG_KEYSTORE}" -storepass android \
            | grep -E 'Alias name|SHA256:' || true

      - name: Upload the encrypted keystore
        if: inputs.export_keystore && steps.keystore.outputs.source == 'cache'
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore-encrypted
          path: ${{ runner.temp }}/keystore-export/swordknights-debug.keystore.enc
          if-no-files-found: error
          retention-days: 1

      # The cached key always uses Android's standard debug alias and password.
      # A key from the secret may name its own in two more secrets, and falls
      # back to the same standard pair when it does not.
      - name: Export Android (debug)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.DEBUG_KEYSTORE }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: >-
            ${{ steps.keystore.outputs.source == 'secret' && secrets.DEBUG_KEYSTORE_ALIAS
            || 'androiddebugkey' }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: >-
            ${{ steps.keystore.outputs.source == 'secret' && secrets.DEBUG_KEYSTORE_PASSWORD
            || 'android' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="dist/swordknights-debug-${GITHUB_SHA::7}.apk"
          godot --headless --path . --export-debug "Android" "${apk}"
          test -s "${apk}"
          ls -l "${apk}"

      # The certificate digest goes into the release notes: when an install
      # fails as "signed differently", comparing it with the previous build's
      # says at once whether the key changed.
      - name: Verify the APK is signed
        id: verify
        run: |
          set -euo pipefail
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)"
          "${apksigner}" verify --verbose --print-certs dist/*.apk | tee "${RUNNER_TEMP}/certs.txt"
          signer="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "${RUNNER_TEMP}/certs.txt" | head -1)"
          echo "signer=${signer}" >> "$GITHUB_OUTPUT"

      # The levels are plain text read with FileAccess, not imported resources,
      # and an export leaves out whatever its include_filter does not name. A
      # build without them boots to the menu and then opens an empty world.
      # An APK is a zip; depending on the export mode the levels sit in it as
      # files or inside an embedded .pck, so look in both the listing and any
      # pack. The look-behind skips a script that merely names a level.
      - name: Verify every level is in the APK
        run: |
          set -euo pipefail
          contents="${RUNNER_TEMP}/apk-contents"
          { unzip -l dist/*.apk; unzip -p dist/*.apk '*.pck' 2>/dev/null || true; } \
            > "${contents}"
          missing=0
          for level in levels/*.txt; do
            if ! grep -aqP "(?<!res://)${level//./\\.}" "${contents}"; then
              echo "::error::${level} is not in the APK"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            echo "::error::Check include_filter in the Android preset of export_presets.cfg."
            exit 1
          fi
          echo "All $(ls levels/*.txt | wc -l) level files are in the APK."

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: swordknights-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to the dev pre-release
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job in any workflow here that writes on a push to main, and it
    # only touches the `dev` tag and the `dev` release.
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CODE: ${{ needs.apk.outputs.code }}
      NAME: ${{ needs.apk.outputs.name }}
      SIGNER: ${{ needs.apk.outputs.signer }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: swordknights-debug-apk
          path: build/apk

      # A re-run of an old run must not replace a newer build: phones on the
      # newer one would never be offered anything again until the run number
      # caught up. Nothing published yet reads as 0.
      - name: Check this build is not older than the one published
        id: order
        run: |
          set -uo pipefail
          published="$(gh release download dev --pattern version.json --output - 2>/dev/null \
            | jq -r '.code // 0' 2>/dev/null)"
          published="${published:-0}"
          [[ "${published}" =~ ^[0-9]+$ ]] || published=0
          echo "Published: build ${published}. This run: build ${CODE}."
          if (( published > CODE )); then
            echo "::notice::The dev release already holds build ${published}; not replacing it with build ${CODE}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write version.json and the release notes
        if: steps.order.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p build/release
          gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}" --jq .commit.message \
            > build/release/message.txt
          # Every commit the push brought, oldest first; empty for a manual run.
          jq -r '(.commits // [])[] | "\(.id) \(.message | split("\n")[0])"' \
            "${GITHUB_EVENT_PATH}" > build/release/commits.txt
          cp build/apk/*.apk build/release/swordknights-dev.apk
          .github/scripts/dev_manifest.sh \
            --apk build/release/swordknights-dev.apk \
            --code "${CODE}" --name "${NAME}" --sha "${GITHUB_SHA}" --repo "${GH_REPO}" \
            --message-file build/release/message.txt \
            --commits-file build/release/commits.txt \
            --signer "${SIGNER}" \
            --out build/release

      # The tag moves with the build so the release page and "Source code"
      # links show what was built. Only refs/tags/dev is ever written.
      - name: Point the dev tag at this commit
        if: steps.order.outputs.skip != 'true'
        run: |
          set -euo pipefail
          if gh api "repos/${GH_REPO}/git/ref/tags/dev" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/dev" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/git/refs" \
              -f ref=refs/tags/dev -f sha="${GITHUB_SHA}" >/dev/null
          fi
          echo "dev -> ${GITHUB_SHA}"

      # The APK goes up before version.json, so the manifest never names a
      # build whose APK is not there yet. --clobber replaces each asset in
      # place, under the same name and so the same URL.
      - name: Update the dev pre-release
        if: steps.order.outputs.skip != 'true'
        run: |
          set -euo pipefail
          title="Development build ${CODE}"
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --title "${title}" --notes-file build/release/notes.md \
              --prerelease --latest=false
          else
            gh release create dev --title "${title}" --notes-file build/release/notes.md \
              --prerelease --latest=false --verify-tag
          fi
          gh release upload dev build/release/swordknights-dev.apk --clobber
          gh release upload dev build/release/version.json --clobber
          gh release view dev --json url,assets --jq '.url, (.assets[] | "  \(.name) \(.size)")'
          echo "::notice::Build ${CODE} is at https://github.com/${GH_REPO}/releases/download/dev/swordknights-dev.apk"

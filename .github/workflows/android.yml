name: Android APK (debug)

# An installable APK for trying the game on a phone, on every push to main and
# on demand from the Actions tab. Debug-signed with a keystore generated inside
# the run, so it needs no repository secrets at all -- unlike release.yml,
# which signs with the release key and only runs for a version tag.
#
# The APK is the run's artifact: Actions -> this workflow -> the run ->
# "swordknights-debug-apk". Android will ask to allow installing from the
# browser or file manager it is opened in. A debug build cannot be installed
# over a release build of the same package; uninstall one first.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'legacy/**'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.5.1'

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Same check as release.yml: the hosted image ships the SDK, and a missing
      # build-tools directory is the usual cause of an export that fails with
      # no explanation.
      - name: Verify the Android SDK is present
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk}" || ! -d "${sdk}" ]]; then
            echo "::error::No Android SDK on this runner (ANDROID_HOME/ANDROID_SDK_ROOT unset)."
            exit 1
          fi
          test -x "${sdk}/platform-tools/adb"
          ls -d "${sdk}"/build-tools/*/apksigner >/dev/null
          echo "ANDROID_HOME=${sdk}" >> "$GITHUB_ENV"
          echo "Android SDK: ${sdk}"

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: 'true'

      - name: Import project
        run: godot --headless --path . --import

      # Godot keeps the SDK and JDK paths in its editor settings, not in the
      # project, and on a fresh runner it guesses ~/Android/Sdk -- not where the
      # hosted image puts the SDK. Written explicitly, after the import has
      # created the file, rather than trusting the guess or the environment.
      - name: Point Godot at the Android SDK and JDK
        run: |
          set -euo pipefail
          settings="${HOME}/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"
          test -f "${settings}"
          for entry in \
              "export/android/android_sdk_path = \"${ANDROID_HOME}\"" \
              "export/android/java_sdk_path = \"${JAVA_HOME}\""; do
            key="${entry%% =*}"
            if grep -q "^${key} = " "${settings}"; then
              sed -i "s|^${key} = .*|${entry}|" "${settings}"
            else
              echo "${entry}" >> "${settings}"
            fi
          done
          grep -E '^export/android/(android|java)_sdk_path' "${settings}"

      # One debug identity for every build, so a new APK installs over the last
      # one instead of being refused for a changed signature. Kept in the
      # Actions cache, not the repository: generated by the first run that
      # finds none, then restored by every run of this workflow and the other
      # Android one, which use the same key. Nothing about a debug key is
      # secret; it just has to stay the same.
      - name: Restore the debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/swordknights-debug.keystore
          key: android-debug-keystore-v1

      - name: Generate the debug keystore if there is none yet
        run: |
          set -euo pipefail
          keystore="${HOME}/.android/swordknights-debug.keystore"
          if [[ -s "${keystore}" ]]; then
            echo "Reusing the cached debug keystore."
          else
            mkdir -p "${HOME}/.android"
            keytool -genkeypair -noprompt \
              -keystore "${keystore}" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a new debug keystore; later runs will reuse it."
          fi
          echo "DEBUG_KEYSTORE=${keystore}" >> "$GITHUB_ENV"

      - name: Export Android (debug)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ env.DEBUG_KEYSTORE }}
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="dist/swordknights-debug-${GITHUB_SHA::7}.apk"
          godot --headless --path . --export-debug "Android" "${apk}"
          test -s "${apk}"
          ls -l "${apk}"

      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)"
          "${apksigner}" verify --verbose dist/*.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: swordknights-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: '4.5.1'

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: 'true'

      - name: Stamp the version from the tag
        run: .github/scripts/stamp_version.sh "${GITHUB_REF_NAME}"

      - name: Import project
        run: godot --headless --path . --import

      - name: Export Web (release)
        run: |
          set -euo pipefail
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Zip
        run: |
          set -euo pipefail
          mkdir -p dist
          # -j would flatten, which is what we want: the zip should unpack to a
          # directory of files you can serve directly.
          (cd build/web && zip -q -r "${GITHUB_WORKSPACE}/dist/swordknights-${GITHUB_REF_NAME}-web.zip" .)
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist/
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub-hosted ubuntu image already ships the Android SDK, so there
      # is no third-party setup action in this pipeline. Godot 4.5 picks the
      # SDK up from ANDROID_HOME on first run and writes it into its editor
      # settings, and finds the JDK the same way -- verified locally.
      - name: Verify the Android SDK is present
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${sdk}" || ! -d "${sdk}" ]]; then
            echo "::error::No Android SDK on this runner (ANDROID_HOME/ANDROID_SDK_ROOT unset)."
            exit 1
          fi
          # Godot shells out to these two; a missing build-tools directory is
          # the usual cause of an export that fails with no explanation.
          test -x "${sdk}/platform-tools/adb"
          ls -d "${sdk}"/build-tools/*/apksigner >/dev/null
          echo "ANDROID_HOME=${sdk}" >> "$GITHUB_ENV"
          echo "Android SDK: ${sdk}"

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: 'true'

      - name: Stamp the version from the tag
        run: .github/scripts/stamp_version.sh "${GITHUB_REF_NAME}"

      - name: Import project
        run: godot --headless --path . --import

      # Godot keeps the SDK and JDK paths in its editor settings, not in the
      # project, and on a fresh runner it guesses ~/Android/Sdk -- not where the
      # hosted image puts the SDK. Written explicitly, after the import has
      # created the file, rather than trusting the guess or the environment.
      - name: Point Godot at the Android SDK and JDK
        run: |
          set -euo pipefail
          settings="${HOME}/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"
          test -f "${settings}"
          for entry in \
              "export/android/android_sdk_path = \"${ANDROID_HOME}\"" \
              "export/android/java_sdk_path = \"${JAVA_HOME}\""; do
            key="${entry%% =*}"
            if grep -q "^${key} = " "${settings}"; then
              sed -i "s|^${key} = .*|${entry}|" "${settings}"
            else
              echo "${entry}" >> "${settings}"
            fi
          done
          grep -E '^export/android/(android|java)_sdk_path' "${settings}"

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set -- cannot sign a release APK."
            echo "::error::See docs/ci.md for how to generate and store it."
            exit 1
          fi
          # Written outside the workspace so it cannot be picked up by an
          # export, an artifact upload or a stray `git add`.
          install -m 700 -d "${RUNNER_TEMP}/signing"
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/signing/release.keystore"
          chmod 600 "${RUNNER_TEMP}/signing/release.keystore"
          echo "Keystore decoded ($(stat -c%s "${RUNNER_TEMP}/signing/release.keystore") bytes)."

      - name: Export Android (release)
        env:
          # Godot 4.5 reads these three directly, which is why no credential
          # ever has to be written into export_presets.cfg.
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/signing/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          godot --headless --path . --export-release "Android" \
            "dist/swordknights-${GITHUB_REF_NAME}.apk"
          test -s "dist/swordknights-${GITHUB_REF_NAME}.apk"

      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)"
          "${apksigner}" verify --verbose "dist/swordknights-${GITHUB_REF_NAME}.apk"

      - name: Shred the keystore
        if: always()
        run: rm -rf "${RUNNER_TEMP}/signing"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/
          if-no-files-found: error

  ios:
    name: iOS (best effort)
    runs-on: macos-latest
    # Best effort by design: without an Apple Developer team id, a signing
    # identity and a provisioning profile there is no signed .ipa to be had,
    # and the release should still go out with Web and Android.
    continue-on-error: true
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Godot ${{ env.GODOT_VERSION }}
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: 'true'

      - name: Stamp the version from the tag
        run: .github/scripts/stamp_version.sh "${GITHUB_REF_NAME}"

      - name: Apply the signing overlay, if secrets are configured
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          IOS_PROVISIONING_PROFILE_UUID: ${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}
        run: .github/scripts/ios_signing_overlay.sh

      - name: Import project
        run: godot --headless --path . --import

      - name: Export iOS
        run: |
          set -euo pipefail
          mkdir -p build/ios dist
          godot --headless --path . --export-release "iOS" build/ios/swordknights.ipa

          # With application/export_project_only=true (the default here) Godot
          # emits an Xcode project rather than an .ipa. Ship whichever exists
          # so the job is useful in both configurations.
          if [[ -s build/ios/swordknights.ipa ]]; then
            cp build/ios/swordknights.ipa "dist/swordknights-${GITHUB_REF_NAME}.ipa"
          else
            (cd build/ios && zip -q -r \
              "${GITHUB_WORKSPACE}/dist/swordknights-${GITHUB_REF_NAME}-ios-xcodeproj.zip" .)
          fi
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: dist/
          if-no-files-found: warn

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    # Web and Android must succeed. iOS is continue-on-error, so it reports
    # success either way and never holds the release back.
    needs: [web, android, ios]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: List what will be attached
        run: |
          set -euo pipefail
          ls -laR artifacts
          if [[ -z "$(find artifacts -type f -print -quit)" ]]; then
            echo "::error::No artifacts to attach."
            exit 1
          fi

      # The GitHub CLI is preinstalled on the runner, so the release is cut
      # without a third-party action.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} exists; replacing its assets."
          else
            gh release create "${tag}" \
              --title "Swordknights ${tag}" \
              --generate-notes \
              --verify-tag
          fi

          # --clobber so re-running the workflow on the same tag is idempotent.
          find artifacts -type f -exec gh release upload "${tag}" {} --clobber \;

          gh release view "${tag}"
